<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" type="image/png" href="https://kodasusaka.com/uploads/favicon-90237e8fbaa8.png">
<link rel="shortcut icon" href="https://kodasusaka.com/uploads/favicon-90237e8fbaa8.png">
<title>JP Downloader</title>
<style>
:root{--bg:#0c0f16;--panel:#111621;--line:#212b3c;--button:#212b3c;--text:#a9b4c6;--pink:#e0607a;--yellow:#f2b544;--white:#eef2f8}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;display:flex;justify-content:center;padding:42px 18px}.shell{width:min(760px,100%)}
.brand{display:flex;flex-direction:column;align-items:center;gap:2px;margin-bottom:34px}.brand img{width:260px;height:260px;object-fit:contain}.brand span{font-size:32px;font-weight:750;letter-spacing:-.8px;color:var(--white)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:22px;box-shadow:0 14px 45px rgba(0,0,0,.2)}h1{margin:0;color:var(--white);font-size:22px;letter-spacing:-.3px}.sub{margin:7px 0 22px;font-size:14px;line-height:1.5}form{display:flex;gap:10px}input{width:100%;min-width:0;background:var(--bg);border:1px solid var(--line);color:var(--white);border-radius:10px;padding:13px 14px;outline:none;font-size:14px}input:focus{border-color:#35445e;box-shadow:0 0 0 3px rgba(224,96,122,.08)}#u.dragover{border-color:var(--pink);box-shadow:0 0 0 3px rgba(224,96,122,.1)}
button,.action{border:0;border-radius:10px;padding:12px 17px;font-weight:750;font-size:14px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;white-space:nowrap}button:disabled{opacity:.5;cursor:not-allowed}.primary{background:var(--pink);color:#fff}.secondary{background:var(--button);color:var(--text);border:1px solid var(--line)}.yellow{background:var(--yellow);color:#16130b}
#panel{margin-top:18px;border-top:1px solid var(--line);padding-top:20px}.hidden{display:none!important}.row{display:flex;justify-content:space-between;gap:16px;align-items:center}.status{font-size:14px;color:var(--white);font-weight:650}.filename-row{display:flex;align-items:center;gap:7px;margin-top:4px;max-width:100%}.filename-input{width:min(100%,420px);background:transparent;border:1px solid transparent;color:#748197;border-radius:7px;padding:3px 6px;font-size:12px;outline:none;min-width:0}.filename-input:focus{background:var(--bg);border-color:var(--line);color:var(--white)}.pencil{background:transparent;border:0;color:#748197;padding:3px 4px;font-size:15px;line-height:1;cursor:pointer}.pencil:hover{color:var(--white)}
.progress{height:9px;background:var(--bg);border:1px solid var(--line);border-radius:999px;overflow:hidden;margin:16px 0 7px}.bar{height:100%;width:0;background:var(--pink);border-radius:inherit;transition:width .25s ease}.percent{font-size:12px;text-align:right;color:#748197}.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:17px}.video-wrap{margin-top:18px;border-radius:12px;overflow:hidden;background:#000;border:1px solid var(--line)}video{display:block;width:100%;max-height:520px;background:#000}.error{margin-top:14px;color:#ff8fa3;font-size:13px;line-height:1.45}.hint{font-size:12px;color:#68758a;margin-top:16px}.drop-hint{font-size:11px;color:#68758a;margin-top:9px;text-align:center}
.history{margin-top:24px}.history-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}.history-title{font-size:13px;font-weight:700;color:var(--white)}.clear-history{background:none;border:0;padding:2px 0;color:#68758a;font-size:11px;font-weight:600;cursor:pointer}.clear-history:hover{color:var(--white)}.history-list{display:flex;flex-direction:column;gap:6px}.history-item{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 11px;border:1px solid var(--line);border-radius:9px;background:var(--bg);cursor:pointer}.history-item:hover{border-color:#35445e}.history-name{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#a9b4c6;font-size:12px}.history-date{flex:0 0 auto;color:#5f6b7e;font-size:10px}
.support{margin-top:34px;padding-top:24px;border-top:1px solid var(--line);overflow:hidden;text-align:center}.support-text{font-size:12px;color:#748197;margin-bottom:14px}.support-logos{display:flex;width:max-content;align-items:center;gap:34px;animation:supportScroll 28s linear infinite}.support-logos img{width:140px;height:58px;object-fit:contain;flex:0 0 auto}.support-logos img:first-child{width:150px}.support-viewport{width:100%;overflow:hidden}@keyframes supportScroll{from{transform:translateX(0)}to{transform:translateX(calc(-50% - 17px))}}
@media(max-width:620px){body{padding:28px 14px}form{flex-direction:column}.brand{margin-bottom:24px}.brand img{width:200px;height:200px}.brand span{font-size:27px}.card{padding:18px}.actions>*{flex:1}.row{align-items:flex-start;flex-direction:column;gap:4px}.row>#cancel{align-self:flex-end;margin-top:-30px}.support{margin-top:28px;padding-top:20px}.support-text{margin-bottom:12px}.support-logos{gap:22px}.support-logos img{width:120px;height:50px}.support-logos img:first-child{width:130px}.filename-input{width:min(100%,calc(100vw - 90px))}}
</style>
</head>
<body>
<main class="shell"><div class="brand"><img src="https://kodasusaka.com/uploads/logo-jp-dark-bf009ef98d20.png" alt="JP Downloader logo"><span>Downloader</span></div>
<section class="card"><h1>Download a video</h1><p class="sub">Paste the URL and it will automatically be converted and ready to download.</p>
<form id="f"><input id="u" type="url" required placeholder="https://kodasusaka.com/watch/title?ep=2" autocomplete="off"><button id="b" class="primary" type="submit">Convert</button></form><div class="drop-hint">You can also drag a watch-page URL onto the box.</div>
<div id="panel" class="hidden"><div class="row"><div><div id="title" class="status">Preparing…</div><div class="filename-row"><input id="filename" class="filename-input" type="text" aria-label="File name" spellcheck="false"><button id="editName" class="pencil" type="button" title="Edit filename" aria-label="Edit filename">✎</button></div></div><button id="cancel" class="secondary" type="button">Cancel</button></div>
<div class="progress" id="progressWrap"><div id="bar" class="bar"></div></div><div id="percent" class="percent">0%</div><div id="actions" class="actions hidden"></div><div id="videoWrap" class="video-wrap hidden"><video id="video" controls playsinline preload="metadata"></video></div><div id="error" class="error hidden"></div></div>
<div class="hint">The page name and episode number are used for the MP4 filename.</div>
<div id="history" class="history hidden"><div class="history-head"><div class="history-title">Recent downloads</div><button id="clearHistory" class="clear-history" type="button">Clear</button></div><div id="historyList" class="history-list"></div></div>
</section>
<div class="support"><div class="support-text">This downloader support the following sites:</div><div class="support-viewport"><div class="support-logos"><img src="https://kodasusaka.com/uploads/logo-jp-dark-bf009ef98d20.png" alt="Koda Susaka"><img src="https://pinkueiga.net/uploads/logo-pk-08b28bb78660.png" alt="Pinku Eiga"><img src="https://18korean.net/uploads/logo18korean-57db9d75a8bd.png" alt="18 Korean"><img src="https://18eu.net/uploads/logo-18eu-0162fac9d6c7.png" alt="18EU"><img src="https://cat3film.com/uploads/cat3logo-7af8e6baca9e.png" alt="CAT3 Film"><img src="https://kodasusaka.com/uploads/logo-jp-dark-bf009ef98d20.png" alt="Koda Susaka"><img src="https://pinkueiga.net/uploads/logo-pk-08b28bb78660.png" alt="Pinku Eiga"><img src="https://18korean.net/uploads/logo18korean-57db9d75a8bd.png" alt="18 Korean"><img src="https://18eu.net/uploads/logo-18eu-0162fac9d6c7.png" alt="18EU"><img src="https://cat3film.com/uploads/cat3logo-7af8e6baca9e.png" alt="CAT3 Film"></div></div></div>
</main>
<script>
const f=document.querySelector('#f'),u=document.querySelector('#u'),b=document.querySelector('#b'),panel=document.querySelector('#panel'),title=document.querySelector('#title'),filename=document.querySelector('#filename'),editName=document.querySelector('#editName'),progressWrap=document.querySelector('#progressWrap'),bar=document.querySelector('#bar'),percent=document.querySelector('#percent'),cancel=document.querySelector('#cancel'),actions=document.querySelector('#actions'),videoWrap=document.querySelector('#videoWrap'),video=document.querySelector('#video'),error=document.querySelector('#error'),history=document.querySelector('#history'),historyList=document.querySelector('#historyList'),clearHistory=document.querySelector('#clearHistory');let timer=null,jobId=null,currentDownload=null,cancelling=false;
function reset(){actions.innerHTML='';actions.classList.add('hidden');videoWrap.classList.add('hidden');video.removeAttribute('src');error.classList.add('hidden');progressWrap.classList.remove('hidden');percent.classList.remove('hidden');bar.style.width='0%';percent.textContent='0%';filename.value='';filename.disabled=true;cancel.disabled=false;cancel.textContent='Cancel';currentDownload=null;cancelling=false}
function action(text,href,cls){const a=document.createElement('a');a.className='action '+cls;a.href=href;a.textContent=text;return a}
function updateDownload(){if(!jobId||!filename.value.trim())return;const name=filename.value.trim().replace(/\.mp4$/i,'');currentDownload='/api/jobs/'+encodeURIComponent(jobId)+'/download?name='+encodeURIComponent(name)}
function saveHistory(name,url){let items=[];try{items=JSON.parse(localStorage.getItem('jpDownloaderHistory')||'[]')}catch{}items=items.filter(x=>x&&x.name!==name);items.unshift({name,url,date:Date.now()});localStorage.setItem('jpDownloaderHistory',JSON.stringify(items.slice(0,8)));renderHistory()}
function renderHistory(){let items=[];try{items=JSON.parse(localStorage.getItem('jpDownloaderHistory')||'[]')}catch{}if(!Array.isArray(items)||!items.length){history.classList.add('hidden');historyList.innerHTML='';return}history.classList.remove('hidden');historyList.innerHTML='';items.forEach(item=>{const row=document.createElement('div');row.className='history-item';const name=document.createElement('div');name.className='history-name';name.textContent=item.name;const date=document.createElement('div');date.className='history-date';date.textContent=new Date(item.date).toLocaleDateString();row.append(name,date);row.addEventListener('click',()=>{if(item.url){u.value=item.url;u.focus()}});historyList.append(row)})}
function finish(j){clearInterval(timer);timer=null;b.disabled=false;cancel.disabled=true;filename.disabled=false;updateDownload();if(j.error||j.status==='Cancelled'){progressWrap.classList.add('hidden');percent.classList.add('hidden');if(j.error){error.textContent=j.error;error.classList.remove('hidden')}return}progressWrap.classList.add('hidden');percent.classList.add('hidden');actions.classList.remove('hidden');const dl=action('Download MP4',currentDownload||j.download,'primary');actions.append(dl);if(j.stream){const stream=action('Stream video',j.stream,'yellow');stream.addEventListener('click',e=>{e.preventDefault();video.src=j.stream;videoWrap.classList.remove('hidden');video.load();video.play().catch(()=>{})});actions.append(stream)}saveHistory(filename.value.trim()||j.filename||j.name||'video.mp4',u.value.trim())}
async function poll(){if(!jobId||cancelling)return;try{const r=await fetch('/api/jobs/'+encodeURIComponent(jobId));const j=await r.json();if(!r.ok)throw Error(j.error||'Job lookup failed.');title.textContent=j.name||j.status;if(j.filename&&!filename.value){filename.value=j.filename;filename.disabled=false;updateDownload()}else if(j.filename){filename.disabled=false}const p=Math.max(0,Math.min(100,Number(j.progress||0)));bar.style.width=p+'%';percent.textContent=Math.round(p)+'%';if(j.done){finish(j);return}}catch(e){if(cancelling)return;clearInterval(timer);timer=null;b.disabled=false;cancel.disabled=true;progressWrap.classList.add('hidden');percent.classList.add('hidden');error.textContent=e.message;error.classList.remove('hidden')}}
f.onsubmit=async e=>{e.preventDefault();if(timer)clearInterval(timer);reset();panel.classList.remove('hidden');b.disabled=true;title.textContent='Starting…';cancel.disabled=false;const raw=u.value.trim();try{localStorage.setItem('jpDownloaderLastUrl',raw)}catch{}try{const r=await fetch('/api/convert',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({url:raw})});const d=await r.json();if(!r.ok)throw Error(d.error||'Could not start conversion.');jobId=d.id;timer=setInterval(poll,700);poll()}catch(e){b.disabled=false;cancel.disabled=true;error.textContent=e.message;error.classList.remove('hidden')}};
filename.addEventListener('input',updateDownload);filename.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();filename.blur()}});editName.onclick=()=>{filename.disabled=false;filename.focus();filename.select()};
cancel.onclick=async()=>{if(!jobId||cancelling)return;cancelling=true;clearInterval(timer);timer=null;cancel.disabled=true;cancel.textContent='Cancelling…';title.textContent='Cancelling…';try{const r=await fetch('/api/jobs/'+encodeURIComponent(jobId),{method:'DELETE'});const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'Could not cancel the conversion.');title.textContent='Cancelled';bar.style.width='0%';percent.textContent='0%';progressWrap.classList.add('hidden');percent.classList.add('hidden');b.disabled=false;cancel.disabled=true;filename.disabled=true}catch(e){cancelling=false;cancel.disabled=false;cancel.textContent='Cancel';title.textContent='Conversion in progress…';error.textContent=e.message;error.classList.remove('hidden');timer=setInterval(poll,700)}};
u.addEventListener('dragover',e=>{e.preventDefault();u.classList.add('dragover')});u.addEventListener('dragleave',()=>u.classList.remove('dragover'));u.addEventListener('drop',e=>{e.preventDefault();u.classList.remove('dragover');const text=e.dataTransfer.getData('text/plain').trim();if(text)u.value=text});
clearHistory.onclick=()=>{localStorage.removeItem('jpDownloaderHistory');renderHistory()};
try{const last=localStorage.getItem('jpDownloaderLastUrl');if(last)u.value=last}catch{}renderHistory();
</script></body></html>
