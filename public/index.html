<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>JP Downloader</title>
<style>
:root{--bg:#0c0f16;--panel:#111621;--line:#212b3c;--button:#212b3c;--text:#a9b4c6;--pink:#e0607a;--yellow:#f2b544;--white:#eef2f8}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;display:flex;justify-content:center;padding:42px 18px}
.shell{width:min(760px,100%)}
.brand{display:flex;align-items:center;gap:18px;margin-bottom:34px}.brand img{width:150px;height:150px;object-fit:contain}.brand span{font-size:32px;font-weight:750;letter-spacing:-.8px;color:var(--white)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:22px;box-shadow:0 14px 45px rgba(0,0,0,.2)}
h1{margin:0;color:var(--white);font-size:22px;letter-spacing:-.3px}.sub{margin:7px 0 22px;font-size:14px;line-height:1.5}
form{display:flex;gap:10px}input{width:100%;min-width:0;background:var(--bg);border:1px solid var(--line);color:var(--white);border-radius:10px;padding:13px 14px;outline:none;font-size:14px}input:focus{border-color:#35445e;box-shadow:0 0 0 3px rgba(224,96,122,.08)}
button,.action{border:0;border-radius:10px;padding:12px 17px;font-weight:750;font-size:14px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;white-space:nowrap}button:disabled{opacity:.5;cursor:not-allowed}
.primary{background:var(--pink);color:#fff}.secondary{background:var(--button);color:var(--text);border:1px solid var(--line)}.yellow{background:var(--yellow);color:#16130b}
#panel{margin-top:18px;border-top:1px solid var(--line);padding-top:20px}.hidden{display:none!important}.row{display:flex;justify-content:space-between;gap:16px;align-items:center}.status{font-size:14px;color:var(--white);font-weight:650}.meta{font-size:12px;color:#748197;margin-top:4px}
.progress{height:9px;background:var(--bg);border:1px solid var(--line);border-radius:999px;overflow:hidden;margin:16px 0 7px}.bar{height:100%;width:0;background:var(--pink);border-radius:inherit;transition:width .25s ease}.percent{font-size:12px;text-align:right;color:#748197}
.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:17px}.video-wrap{margin-top:18px;border-radius:12px;overflow:hidden;background:#000;border:1px solid var(--line)}video{display:block;width:100%;max-height:520px;background:#000}.error{color:#ff8fa3}.hint{font-size:12px;color:#68758a;margin-top:16px}
.method-picker{margin-top:18px;padding:16px;border:1px solid var(--line);border-radius:12px;background:var(--bg)}.method-title{font-size:14px;font-weight:700;color:var(--white);margin-bottom:4px}.method-sub{font-size:12px;color:#748197;margin-bottom:12px;line-height:1.45}.methods{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.method{min-width:0;width:100%;text-align:left;justify-content:flex-start;white-space:normal;line-height:1.35;padding:12px}.method strong{display:block;color:var(--white);font-size:13px;margin-bottom:3px}.method small{display:block;color:#748197;font-size:11px;font-weight:500}.method.selected{outline:2px solid var(--pink);outline-offset:-2px}
@media(max-width:620px){body{padding:28px 14px}form{flex-direction:column}.brand{margin-bottom:24px}.brand img{width:120px;height:120px}.brand span{font-size:27px}.card{padding:18px}.actions>*{flex:1}.row{align-items:flex-start;flex-direction:column;gap:4px}.methods{grid-template-columns:1fr}.method-picker{padding:14px}.method{padding:11px 12px}}
@media(max-width:390px){.method strong{font-size:12px}.method small{font-size:10.5px}}
</style>
</head>
<body>
<main class="shell">
  <div class="brand"><img src="https://kodasusaka.com/uploads/logo-jp-dark-bf009ef98d20.png" alt="JP Downloader logo"><span>Downloader</span></div>
  <section class="card">
    <h1>Download a video</h1>
    <p class="sub">Paste an authorized watch-page URL and the downloader will find the player source automatically.</p>
    <form id="f"><input id="u" type="url" required placeholder="https://kodasusaka.com/watch/title?ep=2" autocomplete="off"><button id="b" class="primary" type="submit">Convert</button></form>
    <div id="panel" class="hidden">
      <div class="row"><div><div id="title" class="status">Preparing…</div><div id="meta" class="meta"></div></div><button id="cancel" class="secondary" type="button">Cancel</button></div>
      <div class="progress" id="progressWrap"><div id="bar" class="bar"></div></div><div id="percent" class="percent">0%</div>
      <div id="actions" class="actions hidden"></div><div id="videoWrap" class="video-wrap hidden"><video id="video" controls playsinline preload="metadata"></video></div><div id="error" class="error hidden"></div>
    </div>
    <div class="hint">The page name and episode number are used for the MP4 filename.</div>
  </section>
</main>
<script>
const f=document.querySelector('#f'),u=document.querySelector('#u'),b=document.querySelector('#b'),panel=document.querySelector('#panel'),title=document.querySelector('#title'),meta=document.querySelector('#meta'),progressWrap=document.querySelector('#progressWrap'),bar=document.querySelector('#bar'),percent=document.querySelector('#percent'),cancel=document.querySelector('#cancel'),actions=document.querySelector('#actions'),videoWrap=document.querySelector('#videoWrap'),video=document.querySelector('#video'),error=document.querySelector('#error');let timer=null,jobId=null;
function reset(){actions.innerHTML='';actions.classList.add('hidden');videoWrap.classList.add('hidden');video.removeAttribute('src');error.classList.add('hidden');progressWrap.classList.remove('hidden');percent.classList.remove('hidden');bar.style.width='0%';percent.textContent='0%';meta.textContent='';cancel.disabled=false}
function action(text,href,cls){const a=document.createElement('a');a.className='action '+cls;a.href=href;a.textContent=text;return a}
function finish(j){clearInterval(timer);timer=null;b.disabled=false;cancel.disabled=true;if(j.error||j.status==='Cancelled'){progressWrap.classList.add('hidden');percent.classList.add('hidden');if(j.error){error.textContent=j.error;error.classList.remove('hidden')}return}progressWrap.classList.add('hidden');percent.classList.add('hidden');actions.classList.remove('hidden');actions.append(action('Download MP4',j.download,'primary'));if(j.stream){const stream=action('Stream video',j.stream,'yellow');stream.addEventListener('click',e=>{e.preventDefault();video.src=j.stream;videoWrap.classList.remove('hidden');video.load();video.play().catch(()=>{})});actions.append(stream)}}
async function poll(){if(!jobId)return;try{const r=await fetch('/api/jobs/'+encodeURIComponent(jobId));const j=await r.json();if(!r.ok)throw Error(j.error||'Job lookup failed.');title.textContent=j.name||j.status;meta.textContent=j.filename?j.filename:j.status;const p=Math.max(0,Math.min(100,Number(j.progress||0)));bar.style.width=p+'%';percent.textContent=Math.round(p)+'%';if(j.done){finish(j);return}}catch(e){clearInterval(timer);timer=null;b.disabled=false;cancel.disabled=true;progressWrap.classList.add('hidden');percent.classList.add('hidden');error.textContent=e.message;error.classList.remove('hidden')}}
f.onsubmit=async e=>{e.preventDefault();if(timer)clearInterval(timer);reset();panel.classList.remove('hidden');b.disabled=true;title.textContent='Starting…';cancel.disabled=false;try{const r=await fetch('/api/convert',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({url:u.value.trim()})});const d=await r.json();if(!r.ok)throw Error(d.error||'Could not start conversion.');jobId=d.id;timer=setInterval(poll,700);poll()}catch(e){b.disabled=false;cancel.disabled=true;error.textContent=e.message;error.classList.remove('hidden')}};
cancel.onclick=async()=>{if(!jobId)return;cancel.disabled=true;try{await fetch('/api/jobs/'+encodeURIComponent(jobId),{method:'DELETE'});await poll()}catch(e){error.textContent=e.message;error.classList.remove('hidden')}};
</script>
</body>
</html>
