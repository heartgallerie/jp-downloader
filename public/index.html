<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HLS → MP4</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#111;color:#fff;font-family:system-ui,sans-serif}.box{width:min(650px,calc(100% - 32px))}h1{margin:0 0 8px}p{color:#aaa;margin:0 0 24px}form{display:flex;gap:10px}input{flex:1;min-width:0;padding:14px 16px;border-radius:10px;border:1px solid #333;background:#1b1b1b;color:#fff}button{border:0;border-radius:10px;padding:0 20px;font-weight:700}button:disabled{opacity:.5}#status{margin-top:20px;padding:14px;background:#1b1b1b;border-radius:10px}.hidden{display:none}a{color:#fff}</style></head><body><main class="box"><h1>HLS → MP4</h1><p>Paste an authorized watch-page URL.</p><form id="f"><input id="u" type="url" required placeholder="https://example.com/watch/title?ep=2"><button id="b">Convert</button></form><div id="s" class="hidden"></div></main><script>const f=document.querySelector('#f'),u=document.querySelector('#u'),b=document.querySelector('#b'),s=document.querySelector('#s');function show(x){s.textContent=x;s.classList.remove('hidden')}f.onsubmit=async e=>{e.preventDefault();b.disabled=true;show('Starting…');try{const r=await fetch('/api/convert',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({url:u.value.trim()})}),d=await r.json();if(!r.ok)throw Error(d.error);const t=setInterval(async()=>{const j=await(await fetch('/api/jobs/'+encodeURIComponent(d.id))).json();show(j.status+(j.seconds?` • ${Math.floor(j.seconds)}s processed`:''));if(j.done){clearInterval(t);b.disabled=false;if(j.error){show('Error: '+j.error);return}const a=document.createElement('a');a.href=j.download;a.textContent='Download MP4';s.append(document.createElement('br'),a)}},1000)}catch(e){b.disabled=false;show('Error: '+e.message)}};</script></body></html>
